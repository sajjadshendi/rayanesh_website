name: Validate magazine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        base: ['/', '/rayanesh_website/']
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: https://build.invalid
      BASE_PATH: ${{ matrix.base }}
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test editorial and security boundaries
        run: npm test
      - name: Check types, build and verify static output
        run: npm run build
      - name: Check dependency advisories
        run: npm audit --audit-level=low
